[project]
name = "barq-sprints-ai-servicenow-support-assistant-group-3"
version = "0.1.0"
description = "BARQ G3 - AI ServiceNow Support Assistant"
readme = "README.md"
authors = [
    { name = "Malak Rabie", email = "158449620+malakmrabie@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.5",
    "langfuse>=4.15.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.19.1",
    "pytesseract>=0.3.13",
    "pymupdf>=1.28.2",
    "pillow>=12.3.0",
    "openai>=3.16.2",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.34.0",
    "langchain-text-splitters>=1.1.3",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "langchain-qdrant>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barq_support"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

