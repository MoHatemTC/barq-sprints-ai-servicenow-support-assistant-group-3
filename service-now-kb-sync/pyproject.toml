[project]
name = "servicenow-kb-sync"
version = "0.1.0"
description = "Standalone ServiceNow Knowledge Base -> Qdrant synchronization service for the BARQ AI Support Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.9",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends()/Path() in argument defaults is the framework idiom.
ignore = ["B008"]
